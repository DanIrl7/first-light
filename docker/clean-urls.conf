# Clean URLs: /result instead of /result.php, and / instead of /index.php.
# Enabled by the Dockerfile. Locally, scripts/router.php does the same job for `php -S`.
<Directory /var/www/html>
    RewriteEngine On

    # A browser that asks for a page with .php is sent to the clean address. Only the request as the browser
    # sent it is checked (THE_REQUEST), so the internal rewrite below doesn't loop. POSTs are left alone.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteCond %{THE_REQUEST} "^[A-Z]+ /index\.php[ ?]"
    RewriteRule ^index\.php$ / [R=301,L]

    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteCond %{THE_REQUEST} "^[A-Z]+ /(start|loading|result|build)\.php[ ?]"
    RewriteRule ^(start|loading|result|build)\.php$ /$1 [R=301,L]

    # /result is served by result.php, and so on.
    RewriteRule ^(start|loading|result|build)$ $1.php [L]
</Directory>
